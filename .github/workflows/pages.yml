name: Deploy and verify GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run check
        env:
          VITE_GA_MEASUREMENT_ID: ${{ vars.VITE_GA_MEASUREMENT_ID }}
      - run: npm run test:smoke
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy built artifact
        id: deployment
        uses: actions/deploy-pages@v4

  # Separate read-only job: "Re-run failed jobs" repeats only the probe,
  # not the successful build, artifact upload, or deployment.
  verify:
    name: Verify published Pages site
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PAGES_URL: ${{ needs.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Require the published URL
        run: test -n "$PAGES_URL"
      - name: Probe home, navigation, shared documentation, and document refresh
        run: npm run test:smoke
      - name: Preserve probe report and failure traces
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pages-live-probe-attempt-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
      - name: Publish probe result
        if: ${{ always() }}
        env:
          PROBE_STATUS: ${{ job.status }}
          PROBE_ARTIFACT: pages-live-probe-attempt-${{ github.run_attempt }}
        run: |
          {
            printf '## Published Pages probe: %s\n\n' "$PROBE_STATUS"
            printf 'URL: %s\n\n' "$PAGES_URL"
            printf 'Checks: home page, repository subpath, section anchors, Architecture navigation, direct documentation index and project overview, and document refresh (desktop/mobile).\n\n'
            printf 'Inspect the %s artifact for the report and failure traces. To retry a failed probe without changing the deployed artifact, choose **Re-run failed jobs**.\n' "$PROBE_ARTIFACT"
          } >> "$GITHUB_STEP_SUMMARY"
