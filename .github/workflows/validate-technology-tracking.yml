name: Validate technology tracking

on:
  pull_request:
    paths:
      - ".github/**"
      - "config/technology-inventory.json"
      - "scripts/*technology*"
      - "tests/**"
      - "manifests/**"
  push:
    branches: [main]
    paths:
      - ".github/**"
      - "config/technology-inventory.json"
      - "scripts/*technology*"
      - "tests/**"
      - "manifests/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: python scripts/check_technology_updates.py --validate-only
      - run: python -m unittest discover -s tests -v
      - run: git diff --check
