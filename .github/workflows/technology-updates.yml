name: Track technology updates

on:
  workflow_dispatch:
  schedule:
    - cron: "17 14 * * 1"

permissions:
  contents: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check release sources
        run: python3 scripts/check_technology_updates.py
      - name: Commit refreshed report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/technology-update-report.md
          git diff --cached --quiet || git commit -m "chore: refresh technology update report"
          git push
      - name: Open review issue when updates are found
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if grep -q '^Updates available: [1-9]' reports/technology-update-report.md; then
            gh issue create --title "Technology updates require review" --body-file reports/technology-update-report.md --label maintenance || true
          fi
