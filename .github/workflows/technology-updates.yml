name: Track technology updates

on:
  workflow_dispatch:
    inputs:
      update_issue:
        description: Update the shared review issue (disable for a read-only validation run)
        type: boolean
        default: true
  schedule:
    - cron: "17 14 * * 1"

permissions:
  contents: read

concurrency:
  group: technology-updates
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Validate inventory and monitoring behavior
        run: |
          python scripts/check_technology_updates.py --validate-only
          python -m unittest discover -s tests -v
      - name: Check releases and maintain the review issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATE_ISSUE: ${{ github.event_name == 'schedule' || inputs.update_issue }}
        run: |
          if [ "$UPDATE_ISSUE" = "true" ]; then
            python scripts/check_technology_updates.py --output-dir .tmp/technology-report --issue
          else
            python scripts/check_technology_updates.py --output-dir .tmp/technology-report
          fi
      - name: Preserve report even when a source fails
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: technology-update-report
          path: .tmp/technology-report/technology-update-report.*
          if-no-files-found: error
          retention-days: 90
      - name: Publish job summary
        if: ${{ always() }}
        run: |
          if [ -f .tmp/technology-report/technology-update-report.md ]; then
            cat .tmp/technology-report/technology-update-report.md >> "$GITHUB_STEP_SUMMARY"
          fi
