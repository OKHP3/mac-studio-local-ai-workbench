name: Validate documentation viewer

on:
  pull_request:
    paths:
      - "src/**"
      - "public/**"
      - "docs/**"
      - "index.html"
      - "package*.json"
      - "vite.config.js"
      - "playwright.config.js"
      - "tests/pages-smoke.spec.js"
      - "scripts/check-dist.mjs"
      - "scripts/post-merge.sh"
      - ".replit"
      - ".gitattributes"
      - ".github/workflows/validate-documentation-viewer.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "docs/**"
      - "index.html"
      - "package*.json"
      - "vite.config.js"
      - "playwright.config.js"
      - "tests/pages-smoke.spec.js"
      - "scripts/check-dist.mjs"
      - "scripts/post-merge.sh"
      - ".replit"
      - ".gitattributes"
      - ".github/workflows/validate-documentation-viewer.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run check
        env:
          VITE_GA_MEASUREMENT_ID: G-TEST123
      - run: npm run test:smoke
        env:
          EXPECT_GA4: "1"
      - run: bash -n scripts/post-merge.sh .githooks/pre-commit
      - run: git diff --check
