name: Check external project links

on:
  schedule:
    - cron: "0 14 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: external-project-links
  cancel-in-progress: false

jobs:
  check-links:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Test link-check policies without external requests
        run: npm run test:links
      - name: Audit homepage external destinations
        run: npm run check:links
      - name: Preserve the audit report, including failed checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: external-project-link-audit
          path: reports/external-link-checks/
          if-no-files-found: warn
          retention-days: 30
